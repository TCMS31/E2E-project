<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sports Roster{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <style>
    body { background-color: #f7f8fa; }
    .navbar-brand { font-weight: 600; letter-spacing: .01em; }
    main { padding-bottom: 3rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between;
                   gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.75rem; margin: 0; }
    .card { border: 1px solid #e4e7ec; box-shadow: 0 1px 2px rgba(16,24,40,.05); }
    .table > :not(caption) > * > * { padding: .75rem 1rem; }
    .table thead th { font-size: .75rem; text-transform: uppercase;
                      letter-spacing: .04em; color: #667085; }
    .empty-state { padding: 3rem 1rem; text-align: center; color: #667085; }
    .auth-card { max-width: 26rem; margin: 3rem auto; }
    a:focus-visible, button:focus-visible, .btn:focus-visible {
      outline: 2px solid #0d6efd; outline-offset: 2px;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">
  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">E2E Innovations</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          {% if user.is_authenticated %}
            <ul class="navbar-nav me-auto">
              <li class="nav-item"><a class="nav-link" href="{% url 'team_list' %}">Teams</a></li>
              <li class="nav-item"><a class="nav-link" href="{% url 'player_list' %}">Players</a></li>
            </ul>
            <span class="navbar-text me-3">Signed in as {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
            </form>
          {% else %}
            <ul class="navbar-nav me-auto"></ul>
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'login' %}">Log in</a>
            <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
          {% endif %}
        </div>
      </div>
    </nav>
  </header>

  <main class="container mt-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
</body>
</html>
